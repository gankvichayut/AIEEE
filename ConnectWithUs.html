<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect with Us | Future Connect</title>
    <style>
        /* --- Reset & Global --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* ฟอนต์สไตล์โมเดิร์น */
        }

        body {
            background-color: #03001a; /* พื้นหลังสีเข้มโทนน้ำเงิน/ม่วง */
            background-image: 
                radial-gradient(at 10% 20%, rgba(126, 34, 206, 0.3) 0px, transparent 50%), /* ม่วง */
                radial-gradient(at 80% 80%, rgba(29, 78, 216, 0.3) 0px, transparent 50%), /* ฟ้า */
                radial-gradient(at 50% 50%, rgba(219, 39, 119, 0.2) 0px, transparent 50%); /* ชมพู */
            background-attachment: fixed;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Main Container (Effect: Glassmorphism) --- */
        .main-container {
            width: 90%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.03); /* โปร่งแสง */
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px); /* เอฟเฟกต์เบลอ */
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(10, 0, 30, 0.37);
            overflow: hidden; /* เพื่อให้มุมแบนเนอร์โค้งตาม container */
            padding-bottom: 30px;
        }

        /* --- Profile/Banner Section --- */
        .profile-banner {
            width: 100%;
            height: 180px;
            background-color: #0c0032; /* สีพื้นหลังกรณีไม่มีรูป */
            background-size: cover;
            background-position: center;
            
            /* [ฮาร์ดโค้ด: ใส่ URL รูปภาพแบนเนอร์ของคุณที่นี่] */
            background-image: url('https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?q=80&w=1000&auto=format&fit=crop'); 
            
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* เอฟเฟกต์แสงเงาด้านล่างแบนเนอร์ */
        .profile-banner::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(to top, rgba(3, 0, 26, 0.8), transparent);
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #fff;
            position: relative;
            z-index: 10;
            margin-bottom: -50px; /* ให้รูปโปรไฟล์เหลื่อมออกมา */
            box-shadow: 0 0 20px rgba(126, 34, 206, 0.5); /* แสงเรืองแสง */
            background-color: #fff;

            /* [ฮาร์ดโค้ด: ใส่ URL รูปภาพโปรไฟล์ของคุณที่นี่] */
            background-image: url('https://i.pravatar.cc/150?u=techyname');
            background-size: cover;
            background-position: center;
        }

        /* --- Text Section --- */
        .text-info {
            text-align: center;
            margin-top: 60px; /* เผื่อพื้นที่ให้รูปโปรไฟล์เหลื่อม */
            padding: 0 20px;
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .profile-bio {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 25px;
        }

        /* --- Buttons Section (Contact Links) --- */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px; /* ระยะห่างระหว่างปุ่ม */
            padding: 0 20px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 20px;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 12px;
            position: relative;
            transition: all 0.3s ease;
            overflow: hidden;
            border: 1px solid transparent;
        }

        /* Effect: Futuristic Gradient Border (ตอนโฮเวอร์) */
        .link-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #7e22ce, #db2777, #1d4ed8);
            opacity: 0.1; /* ปรกติให้จาง */
            transition: 0.3s;
            z-index: -1;
        }

        /* เอฟเฟกต์แสงเรืองแสง (Neon Glow) ตอนโฮเวอร์ */
        .link-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(219, 39, 119, 0.5); /* เรืองแสงสีชมพู */
            border-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        .link-button:hover::before {
            opacity: 0.3; /* เรืองแสงขึ้นมา */
        }

        /* Styles สำหรับแต่ละปุ่ม (กำหนดสี Border สไตล์ Tech) */
        .facebook-btn { border: 1px solid rgba(29, 161, 242, 0.4); } /* สีฟ้า */
        .instagram-btn { border: 1px solid rgba(219, 39, 119, 0.4); } /* สีชมพู */
        .line-btn { border: 1px solid rgba(6, 193, 0, 0.4); } /* สีเขียว */
        .email-btn { border: 1px solid rgba(126, 34, 206, 0.4); } /* สีม่วง */

        /* เพิ่มความระยิบระยับแบบเทค (Scanning line) */
        .link-button::after {
            content: '';
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }

        .link-button:hover::after {
            top: 100%;
        }

    </style>
</head>
<body>

    <div class="main-container">
        <!-- แบนเนอร์ (Hard-coded background ใน CSS) -->
        <div class="profile-banner">
            <!-- รูปโปรไฟล์ (Hard-coded background ใน CSS) -->
            <div class="profile-pic"></div>
        </div>

        <div class="text-info">
            <!-- [ฮาร์ดโค้ด: เปลี่ยนชื่อและ Bio ที่นี่] -->
            <h1 class="profile-name">Futurist Tech Solutions</h1>
            <p class="profile-bio">Connect with the future of digital innovation.</p>
        </div>

        <div class="links-container">
            <!-- [ฮาร์ดโค้ด: เปลี่ยนลิงก์ URL ที่ href="..." ของแต่ละปุ่มที่นี่] -->

            <!-- Facebook -->
            <a href="https://facebook.com/yourpagename" target="_blank" class="link-button facebook-btn">
                <span>Facebook Page</span>
            </a>

            <!-- Instagram -->
            <a href="https://instagram.com/yourusername" target="_blank" class="link-button instagram-btn">
                <span>Instagram</span>
            </a>

            <!-- Line OA -->
            <a href="https://line.me/ti/p/@yourlineoa" target="_blank" class="link-button line-btn">
                <span>LINE Official Account</span>
            </a>

            <!-- Email (รูปแบบ mailto:) -->
            <a href="mailto:your.email@example.com" class="link-button email-btn">
                <span>Email Us</span>
            </a>
        </div>
    </div>

</body>
</html>
